<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown</title>
  <!-- Stagio Extra: the opening countdown, full screen on the projector (opened by the desktop
       app while a countdown part of the run of show is on). Big, plain, readable from the back. -->
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #f4f4f2; overflow: hidden; cursor: none;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4vh 6vw; box-sizing: border-box; }
    #title { font-size: 5.2vh; font-weight: 500; letter-spacing: .02em; color: #c9c9c4; min-height: 6vh; margin-bottom: 2vh; }
    #time { font-size: 30vh; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    #time.done { color: #8a8a85; }
    #notice { font-size: 4.2vh; color: #b3b3ae; min-height: 6vh; margin-top: 5vh; max-width: 80vw; transition: opacity .6s; }
    #notice.out { opacity: 0; }
    .blank #title, .blank #time, .blank #notice { visibility: hidden; }
  </style>
</head>
<body class="blank">
  <main>
    <div id="title"></div>
    <div id="time">0:00</div>
    <div id="notice"></div>
  </main>
  <script>
    'use strict';
    const $ = (s) => document.querySelector(s);
    let info = null;   // { target, title, notices, now }
    let offset = 0;    // the Stagio computer's clock minus this page's
    let noticeAt = 0;
    let noticeIdx = -1;

    async function load() {
      try {
        const t0 = Date.now();
        const r = await fetch('/api/run/countdown', { cache: 'no-store' });
        const j = await r.json();
        info = j.ok ? j.data : null;
        if (info) offset = info.now - (t0 + Date.now()) / 2;
      } catch { /* keep the last one: a missed answer must not blank the screen */ }
    }

    function fmt(ms) {
      const s = Math.max(0, Math.ceil(ms / 1000));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const ss = String(s % 60).padStart(2, '0');
      return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
    }

    function draw() {
      document.body.classList.toggle('blank', !info);
      if (!info) return;
      const left = info.target - (Date.now() + offset);
      const time = $('#time');
      time.textContent = fmt(left);
      time.classList.toggle('done', left <= 0);
      if ($('#title').textContent !== info.title) $('#title').textContent = info.title;
      // Notices take turns every 8 seconds, fading between them.
      const list = info.notices || [];
      const n = $('#notice');
      if (!list.length) { n.textContent = ''; noticeIdx = -1; return; }
      if (noticeIdx < 0 || noticeIdx >= list.length || Date.now() - noticeAt > 8000) {
        noticeAt = Date.now();
        const nextIdx = (noticeIdx + 1) % list.length;
        if (list.length === 1 || noticeIdx < 0) { n.textContent = list[nextIdx]; n.classList.remove('out'); }
        else { n.classList.add('out'); setTimeout(() => { n.textContent = list[nextIdx]; n.classList.remove('out'); }, 600); }
        noticeIdx = nextIdx;
      }
    }

    load().then(draw);
    setInterval(load, 1000);
    setInterval(draw, 200);
  </script>
</body>
</html>
